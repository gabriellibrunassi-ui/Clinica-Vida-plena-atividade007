<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Clinica Vida Plena</title>
</head>
 

<body>
    <header>
   
        <h1>Clínica Vida Plena</h1>
        <nav>
            <a href="index.html">Início</a> |
            <a href="agendamneto.html">Agendamento</a>
        </nav>
        
    </header>

    <main>
        <h2>Agende sua consulta</h2>
         <form action="#" method="post">
            <label for="nome">Nome Completo</label>
            <input type="text" name="nome" id="nome" required>
            <br>

            <label for="email">Email:</label>
            <input type="email" name="email" id="email">
            <br>

            <label for="telefone">Telefone:</label>
            <input 
                type="tel" 
                name="telefone" 
                id="telefone" 
                required
                inputmode="numeric"
                maxlength="15"
                pattern="(?:\(?[1-9]{2}\)?\s?)?(?:9\d{4}|\d{4})-?\d{4}"
                title="Digite com o DDD.Ex (17) 99674-2630 ou 17996742630"
                >
            <br>
            <label for="data">Data:</label>
            <input type="date" name="data" id="data" required>
            <br>

            <label for="hora">Hora:</label>
            <input type="time" name="hora" id="hora" required>
            <br>

            <label for="especialidades">Especialidades</label>
            <select name="especialidades" id="especialidades" required>
                <option value="">Selecione uma opção</option>
                <option value="clinico-geral">Clinico Geral</option>
                <option value="cardiologia">Cardiologia</option>
                <option value="dermatologia">Dermatologia</option>
                <option value="pediatria">Pediatria</option>
            </select>
            <br>
            <label for="mensagem">Mensagem:</label>
            <textarea name="mensagem" id="mensagem" rows="4"></textarea>
            <br>
            <button type="submit">Confirmar agendamento</button>

        </form>
    </main>

    <footer>
        <p>
            Clinica Vida Plena - Todos os direitos reservados.
        </p>
    </footer>
</body>

</html>
